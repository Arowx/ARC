<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babel</title>
<style>
  html, body { margin: 0; height: 100%; background: #2B2622; overflow: hidden; }
  #wrap { display: flex; height: 100%; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; outline: none; display: block; }
  /* no words while loading (the jam's rule): a turning ring in the title's vermilion on parchment */
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #2B2622; }
  #load div { width: 56px; height: 56px; border-radius: 50%; border: 6px solid #F2E8D2; border-top-color: #A8382A; animation: turn 1s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="load"><div></div></div>
<script>
  // URL query -> argv:  index.html?--seed=4
  var args = location.search.length > 1 ? location.search.slice(1).split('&').map(decodeURIComponent).filter(Boolean) : [];
  var Module = {
    arguments: args,
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    onRuntimeInitialized: function () { document.getElementById('load').remove(); document.getElementById('canvas').focus(); }
  };
  // keep the game's keys (Space, Tab, arrows) from scrolling the itch page or leaving the canvas
  window.addEventListener('keydown', function (e) { if ([' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault(); });
  document.getElementById('canvas').addEventListener('mousedown', function () { this.focus(); });
</script>
{{{ SCRIPT }}}
</body>
</html>
